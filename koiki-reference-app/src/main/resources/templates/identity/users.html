<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identity user lookup</title>
</head>
<body>
<main>
  <h1>Identity user lookup</h1>
  <form method="get" th:action="@{/identity/users}">
    <label for="userId">User ID</label>
    <input id="userId" name="userId" type="text" required autocomplete="off">
    <button type="submit">Open user</button>
  </form>
</main>
</body>
</html>
