<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{koiki/fragments :: head('Identity user lookup')}"></head>
<body>
<header th:replace="~{koiki/fragments :: header}"></header>
<main>
  <h1>Identity user lookup</h1>
  <form method="get" th:action="@{/identity/users}">
    <label for="userId">User ID</label>
    <input id="userId" name="userId" type="text" required autocomplete="off">
    <button type="submit">Open user</button>
  </form>
</main>
</body>
</html>
