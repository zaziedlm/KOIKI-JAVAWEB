<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identity user</title>
</head>
<body>
<main>
  <h1>Identity user</h1>
  <dl>
    <dt>User ID</dt>
    <dd th:text="${user.userId}"></dd>
    <dt>Email</dt>
    <dd th:text="${user.email}"></dd>
    <dt>Status</dt>
    <dd th:text="${user.status}"></dd>
    <dt>Version</dt>
    <dd th:text="${user.version}"></dd>
  </dl>
  <h2>Roles</h2>
  <ul>
    <li th:each="role : ${user.roleCodes}">
      <span th:text="${role}"></span>
      <form th:action="@{/identity/users/{userId}/roles/{roleCode}/revoke(userId=${user.userId},roleCode=${role})}"
            method="post">
        <input type="hidden" name="expectedVersion" th:value="${user.version}">
        <button type="submit">Revoke role</button>
      </form>
    </li>
  </ul>
  <h2>Assign role</h2>
  <form th:action="@{/identity/users/{userId}/roles(userId=${user.userId})}" method="post">
    <label for="roleCode">Role code</label>
    <input id="roleCode" name="roleCode" type="text" required>
    <input type="hidden" name="expectedVersion" th:value="${user.version}">
    <button type="submit">Assign role</button>
  </form>
  <h2>Permissions</h2>
  <ul>
    <li th:each="permission : ${user.permissionCodes}" th:text="${permission}"></li>
  </ul>
  <a th:href="@{/identity/users}">Look up another user</a>
</main>
</body>
</html>
