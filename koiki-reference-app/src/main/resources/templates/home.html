<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{koiki/fragments :: head('KOIKI Reference')}"></head>
<body><header th:replace="~{koiki/fragments :: header}"></header>
<main><h1>KOIKI Reference Application</h1>
  <p>付与されたPermissionに対応する業務画面を利用してください。</p>
  <p class="muted">権限のない画面への直接アクセスはサーバー側で拒否されます。</p>
  <ul aria-label="権限別の業務画面">
    <li th:if="${canApplyExpenses}"><a th:href="@{/expenses}">自分の経費申請</a></li>
    <li th:if="${spaAvailable and canApplyExpenses}"><a th:href="@{/spa/}">Session SPAで経費申請を開く</a></li>
    <li th:if="${canApproveExpenses}"><a th:href="@{/expenses/approvals}">承認対象の経費申請</a></li>
  </ul>
</main></body></html>
