<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{koiki/fragments :: head(${editing ? '経費申請編集' : '経費申請作成'})}"></head>
<body>
<header th:replace="~{koiki/fragments :: header}"></header>
<main>
  <h1 th:text="${editing ? '経費申請編集' : '経費申請作成'}"></h1>
  <p class="muted">Phase 3の最小画面では1明細の申請を扱います。</p>
  <form method="post" th:action="${editing} ? @{/expenses/{id}/edit(id=${expenseRequestId})} : @{/expenses}" th:object="${form}">
    <input th:if="${editing}" type="hidden" th:field="*{expenseLineId}">
    <input th:if="${editing}" type="hidden" th:field="*{expectedVersion}">
    <label for="departmentId">部門</label>
    <select id="departmentId" th:field="*{departmentId}" required aria-describedby="department-error">
      <option value="">選択してください</option>
      <option th:each="option : ${departments}" th:value="${option.id}" th:text="|${option.code} ${option.name}|"></option>
    </select>
    <p id="department-error" class="error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></p>
    <label for="claimedAmount">申請額</label>
    <input id="claimedAmount" type="number" min="1" th:field="*{claimedAmount}" required>
    <p class="error" th:if="${#fields.hasErrors('claimedAmount')}" th:errors="*{claimedAmount}"></p>
    <fieldset><legend>明細</legend>
      <label for="expenseCategoryId">経費科目</label>
      <select id="expenseCategoryId" th:field="*{expenseCategoryId}" required>
        <option value="">選択してください</option>
        <option th:each="option : ${categories}" th:value="${option.id}" th:text="|${option.code} ${option.name}|"></option>
      </select>
      <p class="error" th:if="${#fields.hasErrors('expenseCategoryId')}" th:errors="*{expenseCategoryId}"></p>
      <label for="usageDate">利用日</label><input id="usageDate" type="date" th:field="*{usageDate}" required>
      <p class="error" th:if="${#fields.hasErrors('usageDate')}" th:errors="*{usageDate}"></p>
      <label for="description">内容</label><input id="description" th:field="*{description}" maxlength="200" required>
      <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
      <label for="purpose">目的</label><textarea id="purpose" th:field="*{purpose}" maxlength="500" required></textarea>
      <p class="error" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></p>
      <label for="lineAmount">明細額</label><input id="lineAmount" type="number" min="1" th:field="*{lineAmount}" required>
      <p class="error" th:if="${#fields.hasErrors('lineAmount')}" th:errors="*{lineAmount}"></p>
    </fieldset>
    <p class="error" th:if="${#fields.hasAnyErrors()}">入力内容を確認してください。</p>
    <button type="submit" th:text="${editing ? '更新' : '下書き保存'}"></button>
  </form>
  <a th:href="@{/expenses}">一覧へ戻る</a>
</main>
</body>
</html>
