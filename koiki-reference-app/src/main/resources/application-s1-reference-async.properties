spring.modulith.events.jdbc.schema=kkref_notification_async
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=UPDATE
spring.modulith.events.registry-trigger-annotation=org.springframework.modulith.events.ApplicationModuleListener
spring.modulith.events.republish-outstanding-events-on-restart=false
spring.modulith.events.externalization.enabled=false
spring.modulith.runtime.verification-enabled=false
spring.modulith.runtime.flyway-enabled=false
spring.modulith.events.staleness.processing=PT0S
spring.modulith.events.staleness.published=PT0S
spring.modulith.events.staleness.resubmitted=PT0S
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
