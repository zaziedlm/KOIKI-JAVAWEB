spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.cache.type=caffeine
spring.cache.cache-names=koiki:reference:expense-category-options
spring.cache.caffeine.spec=maximumSize=1,expireAfterWrite=30s
spring.flyway.locations=classpath:db/migration/kkref
spring.flyway.table=kkref_flyway_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
koiki.identity.local-authentication.enabled=true
koiki.identity.login-attempt.source-protection=APPLICATION
koiki.identity.login-attempt.source-hmac-key-id=${KOIKI_REFERENCE_SOURCE_HMAC_KEY_ID}
koiki.identity.login-attempt.source-hmac-key=${KOIKI_REFERENCE_SOURCE_HMAC_KEY}
