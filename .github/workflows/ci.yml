name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          # windows-2025 temporarily disabled: production runtime is Linux-only, re-enable if that changes
          - ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify with Maven Wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

      - name: Verify with Maven Wrapper on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify Tier 1 and Tier 2 Feature Templates
        shell: pwsh
        run: pwsh -NoProfile -File build-support/feature-templates/verify-feature-templates.ps1

      - name: Verify NullAway positive, negative, and restore paths
        shell: pwsh
        run: pwsh -NoProfile -File build-support/null-safety/verify-null-safety.ps1

  milestone-b-integration:
    name: Milestone B Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Phase 1b Data and Runtime Integration
        shell: pwsh
        run: pwsh -NoProfile -File build-support/runtime-foundation-verification/verify-cp7-domain-event-mybatis.ps1

  public-api-compatibility:
    name: Public API Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify published Public API baseline
        shell: pwsh
        env:
          KOIKI_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOIKI_PACKAGES_USER: ${{ github.actor }}
        run: >-
          pwsh -NoProfile -File
          build-support/api-compatibility/verify-public-api-compatibility.ps1
          -GitHubUser $env:KOIKI_PACKAGES_USER
          -GitHubActions

      - name: Verify Public API compatibility fixtures
        shell: pwsh
        run: pwsh -NoProfile -File build-support/api-compatibility/verify-public-api-fixtures.ps1
