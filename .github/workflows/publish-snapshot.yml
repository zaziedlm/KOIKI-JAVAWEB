name: Publish internal snapshot

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character main commit SHA approved for publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase1a-internal-snapshot
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm approved source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm approved main commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Snapshots may only be published from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a lowercase 40-character Git commit SHA." >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Approved commit does not match the workflow commit." >&2
            exit 1
          fi

  preflight:
    name: Preflight (${{ matrix.os }})
    needs: authorize
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          # windows-2025 temporarily disabled: production runtime is Linux-only, re-enable if that changes
          - ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify with Maven Wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

      - name: Verify with Maven Wrapper on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify Tier 1 and Tier 2 Feature Templates
        shell: pwsh
        run: pwsh -NoProfile -File build-support/feature-templates/verify-feature-templates.ps1

      - name: Verify NullAway positive, negative, and restore paths
        shell: pwsh
        run: pwsh -NoProfile -File build-support/null-safety/verify-null-safety.ps1

  publish:
    name: Publish approved snapshot
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: phase1a-internal-snapshot
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21 and Maven authentication
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish the approved four-artifact release unit
        shell: bash
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl koiki-dependencies-bom,koiki-parent,koiki-architecture-contract,koiki-archunit-rules
          -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/zaziedlm/KOIKI-JAVAWEB
          -DdeployAtEnd=true
          clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
