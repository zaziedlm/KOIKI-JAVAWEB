name: Publish Phase 1b internal snapshot

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character main commit SHA approved for Phase 1b publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: koiki-internal-snapshot
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm approved Phase 1b source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm approved main commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Phase 1b snapshots may only be published from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a lowercase 40-character Git commit SHA." >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Approved commit does not match the workflow commit." >&2
            exit 1
          fi

  preflight:
    name: Phase 1b closeout preflight
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Phase 1b closeout
        shell: pwsh
        run: pwsh -NoProfile -File build-support/runtime-foundation-verification/verify-cp10-closeout.ps1

  publish:
    name: Publish approved nine-artifact snapshot
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: phase1b-internal-snapshot
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21 and Maven authentication
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish the approved Phase 1b release unit
        shell: bash
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -pl koiki-dependencies-bom,koiki-parent,koiki-architecture-contract,koiki-archunit-rules,koiki-starters/koiki-starter-api,koiki-starters/koiki-starter-data,koiki-starters/koiki-starter-data-jpa,koiki-starters/koiki-starter-observability,koiki-testing
          -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/zaziedlm/KOIKI-JAVAWEB
          -DdeployAtEnd=true
          clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-remote-consumer:
    name: Resolve snapshot and build independent Consumer
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Temurin 21 and Maven authentication
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve all nine artifacts and test the independent Consumer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = Join-Path $env:RUNNER_TEMP 'phase1b-remote-repository'
          $remote = 'github::default::https://maven.pkg.github.com/zaziedlm/KOIKI-JAVAWEB'
          $artifacts = @(
            'org.koikifw:koiki-dependencies-bom:0.1.0-SNAPSHOT:pom',
            'org.koikifw:koiki-parent:0.1.0-SNAPSHOT:pom',
            'org.koikifw:koiki-architecture-contract:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-archunit-rules:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-starter-api:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-starter-data:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-starter-data-jpa:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-starter-observability:0.1.0-SNAPSHOT:jar',
            'org.koikifw:koiki-testing:0.1.0-SNAPSHOT:jar'
          )
          foreach ($artifact in $artifacts) {
            ./mvnw --batch-mode --no-transfer-progress --non-recursive `
              "-Dmaven.repo.local=$repository" `
              org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get `
              "-Dartifact=$artifact" "-DremoteRepositories=$remote" -Dtransitive=true
            if ($LASTEXITCODE -ne 0) { throw "Remote resolution failed for $artifact" }
          }
          ./mvnw --batch-mode --no-transfer-progress `
            "-Dmaven.repo.local=$repository" `
            -f build-support/runtime-foundation-consumer/pom.xml clean verify
          if ($LASTEXITCODE -ne 0) { throw 'Remote-artifact Consumer build failed' }
