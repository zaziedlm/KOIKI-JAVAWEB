spring.application.name=koiki-ws-flyway-two-tier
spring.main.web-application-type=none

spring.datasource.url=${WS_FLYWAY_JDBC_URL:jdbc:postgresql://localhost:55432/koiki_ws}
spring.datasource.username=${WS_FLYWAY_DB_USER:koiki}
spring.datasource.password=${WS_FLYWAY_DB_PASSWORD:koiki}

# Spring Boot's standard Flyway instance remains the Customer-owned tier.
spring.flyway.locations=classpath:db/migration/customer
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

ws.flyway.expected-koiki-version=${WS_EXPECTED_KOIKI_VERSION:1}
